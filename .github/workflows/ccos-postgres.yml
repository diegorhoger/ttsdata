name: CCOS PostgreSQL verification

on:
  pull_request:
    paths:
      - 'apps/api/src/routes/ccos.ts'
      - 'apps/api/src/routes/display.ts'
      - 'packages/db/**'
      - 'tests/ccos/**'
      - 'tests/display/**'
      - '.github/workflows/ccos-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ttsdata
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: ttsdata_ccos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ttsdata -d ttsdata_ccos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.6 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run forward, constraints, rollback and reapply verification
        env:
          TEST_DATABASE_URL: postgresql://ttsdata:test-only-password@127.0.0.1:5432/ttsdata_ccos_test
        run: pnpm verify:ccos-postgres
